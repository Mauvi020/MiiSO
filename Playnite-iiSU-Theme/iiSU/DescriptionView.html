<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style type="text/css">
        HTML,BODY
        {
            color: {foreground};
            font-family: "{font_family}";
            font-size: {font_size}px;
            margin: 0;
            padding: 0;
            background-color: #0A0E17;
        }

        a {
            color: {link_foreground};
            text-decoration: none;
        }

        h1, h2, h3, h4 {
            color: #FFFFFF;
        }

        strong, b {
            color: #EAF0FF;
        }

        img {
            max-width: 100%;
            border-radius: 8px;
        }

        table {
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid #2A3350;
            padding: 6px 10px;
        }

        blockquote {
            border-left: 4px solid #4F8CFF;
            margin: 8px 0;
            padding: 4px 12px;
            color: #B9C4E0;
        }

        hr {
            border: 0;
            border-top: 1px solid #2A3350;
        }
    </style>
    <title>Game Description</title>
</head>
<body>
<div>
{text}
</div>
</body>
</html>
